<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Healthcare AI - Medical Image Analysis</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 to-black min-h-screen flex items-center justify-center p-4">

  <div class="bg-white shadow-2xl rounded-2xl p-6 w-full max-w-2xl">

    <h1 class="text-3xl font-extrabold text-center text-black mb-2">
       Healthcare AI
    </h1>
    <p class="text-center text-gray-600 mb-6">
      Upload a medical image and receive AI-assisted analysis instantly.
    </p>

    <div class="border-2 border-dashed border-gray-400 rounded-xl p-4 text-center mb-4">
      <input
        type="file"
        id="imageInput"
        accept="image/*"
        onchange="previewImage(event)"
        class="block w-full text-sm text-gray-700
               file:mr-4 file:py-2 file:px-4
               file:rounded-full file:border-0
               file:text-sm file:font-semibold
               file:bg-gray-200 file:text-black
               hover:file:bg-gray-300"
      />
      <p class="text-xs text-gray-500 mt-2">
        Supported: MRI, X-ray, Histopathology, Skin images
      </p>
    </div>

    <div id="previewContainer" class="hidden mb-4">
      <p class="text-sm font-semibold text-gray-700 mb-2">  Uploaded Image</p>
      <img id="previewImage" class="w-full max-h-64 object-contain rounded-lg border border-gray-300" />
    </div>

    <button
      onclick="analyzeImage()"
      class="w-full bg-black hover:bg-gray-800 text-white py-3 rounded-xl font-semibold transition"
    >
      Analyze Image
    </button>

    <div id="loading" class="hidden text-center text-black font-semibold mt-4 animate-pulse">
      Analyzing image, please wait...
    </div>

    <div id="result" class="hidden mt-6 space-y-4">

      <div class="bg-gray-100 border border-gray-300 rounded-lg p-4">
        <p class="text-sm text-gray-800">
          <strong>Detected Image Type:</strong>
          <span id="imageType" class="font-semibold"></span>
        </p>
      </div>

      <div class="bg-gray-50 border border-gray-300 rounded-lg p-4">
        <p id="disease" class="text-xl font-bold text-black"></p>
        <p id="confidence" class="text-sm text-gray-700 mb-2"></p>

        <div class="w-full bg-gray-300 rounded-full h-3">
          <div id="confidenceBar" class="bg-black h-3 rounded-full transition-all"></div>
        </div>
      </div>

      <div class="bg-blue-50 border border-blue-300 rounded-lg p-4">
  <p class="font-semibold text-blue-900 mb-2">
    AI Medical Explanation
  </p>

  <!-- THIS is where text appears -->
  <div
    id="aiExplanation"
    class="text-sm text-blue-800 whitespace-pre-line"
  ></div>
</div>

      <details class="text-sm">
        <summary class="cursor-pointer font-semibold text-gray-700">
          View all probabilities
        </summary>
        <pre
          id="allProbs"
          class="bg-gray-100 p-3 rounded mt-2 overflow-x-auto text-xs"
        ></pre>
      </details>

      

    </div>
  </div>

  <script src="app.js"></script>

  <script>
    function previewImage(event) {
      const img = document.getElementById("previewImage");
      const container = document.getElementById("previewContainer");
      img.src = URL.createObjectURL(event.target.files[0]);
      container.classList.remove("hidden");
    }
  </script>

</body>
</html>
